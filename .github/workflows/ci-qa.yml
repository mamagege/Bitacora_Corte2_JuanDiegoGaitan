name: CI — Build · Test · Deploy QA

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/restaurante-api

jobs:

  test:
    name: Pruebas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}

      - name: Ejecutar pruebas
        run: mvn test --no-transfer-progress

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: target/site/jacoco/

  build-and-push:
    name: Build imagen Docker
    needs: test                     # solo si los tests pasan
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Metadata de la imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=qa-        # tag: qa-abc1234
            type=raw,value=qa-latest

      - name: Build y push
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-qa:
    name: Desplegar a QA
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: qa                 # ambiente configurado en GitHub
    steps:
      - name: Login a Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Desplegar en Azure Web App (QA)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME_QA }}
          images: ${{ env.IMAGE_NAME }}:qa-latest

      - name: Configurar variables de entorno en Azure QA
        uses: azure/appservice-settings@v1
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME_QA }}
          app-settings-json: |
            [
              {"name": "SPRING_PROFILES_ACTIVE", "value": "docker"},
              {"name": "JWT_SECRET", "value": ${{ toJson(secrets.JWT_SECRET_QA) }}},
              {"name": "DB_PASSWORD", "value": ${{ toJson(secrets.DB_PASSWORD_QA) }}},
              {"name": "DB_HOST", "value": ${{ toJson(secrets.DB_HOST_QA) }}},
              {"name": "DB_USER", "value": ${{ toJson(secrets.DB_USER_QA) }}},
              {"name": "SPRING_DATA_MONGODB_URI", "value": ${{ toJson(secrets.MONGO_URI_QA) }}}
            ]
